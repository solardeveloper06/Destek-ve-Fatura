<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Enerji Analiz Paneli</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 520px;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .remote-box {
            display: none;
            background-color: #f8f9fa;
            border: 1px dashed #27ae60;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #219653;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f8f5;
            border-left: 5px solid #27ae60;
            display: none;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ahmet GÖKTÜRK project loading</h2>
        <form id="solarForm">
            <div class="form-group">
                <label>Kurulum Tipi:</label>
                <select name="installation_type">
                    <option value="cati">Çatı</option>
                    <option value="arazi">Arazi</option>
                </select>
            </div>

            <div class="form-group">
                <label>Kurulu Güç (kWe):</label>
                <input type="number" step="0.01" name="installed_power_kwe" required placeholder="Örn: 50">
            </div>

            <div class="form-group">
                <label>Aylık Üretim (kWh):</label>
                <input type="number" step="0.01" name="generation_kwh" placeholder="Örn: 12000" required>
            </div>

            <div class="form-group">
                <label>Aylık Tüketim (kWh):</label>
                <input type="number" step="0.01" name="consumption_kwh" placeholder="Örn: 10000" required>
            </div>

            <!-- Ayrı Yer Tüketimi Seçeneği -->
            <div class="form-group">
                <label>Ayrı Yer Tüketimi Var mı?</label>
                <select name="has_remote" id="hasRemoteSelect">
                    <option value="hayir">Yok</option>
                    <option value="evet">Var</option>
                </select>
            </div>

            <!-- Var Seçilince Açılacak Alanlar -->
            <div class="remote-box" id="remoteBox">
                <div class="form-group">
                    <label>Ayrı Yer Tüketim Miktarı (kWh):</label>
                    <input type="number" step="0.01" name="remote_consumption_kwh" id="remoteConsumptionInput" placeholder="Örn: 4500">
                </div>
                <div class="form-group">
                    <label>Ayrı Yer Tarifesi:</label>
                    <select name="remote_tariff">
                        <option value="mesken">Mesken</option>
                        <option value="ticarethane">Ticarethane</option>
                        <option value="sanayi">Sanayi</option>
                        <option value="tarimsal">Tarımsal</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Trafo Kaybı Durumu:</label>
                <select name="transformer_loss_status">
                    <option value="yok">Yok</option>
                    <option value="var">Var</option>
                </select>
            </div>

            <div class="form-group">
                <label>Ana Tesis Tarifesi:</label>
                <select name="tariff">
                    <option value="ticarethane">Ticarethane</option>
                    <option value="sanayi">Sanayi</option>
                    <option value="mesken">Mesken</option>
                    <option value="tarimsal">Tarımsal</option>
                </select>
            </div>

            <button type="submit">Hesapla</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        // Ayrı Yer Tüketimi kutusunu dinamik açıp kapatma
        const hasRemoteSelect = document.getElementById('hasRemoteSelect');
        const remoteBox = document.getElementById('remoteBox');
        const remoteConsumptionInput = document.getElementById('remoteConsumptionInput');

        hasRemoteSelect.addEventListener('change', function() {
            if (this.value === 'evet') {
                remoteBox.style.display = 'block';
                remoteConsumptionInput.setAttribute('required', 'required');
            } else {
                remoteBox.style.display = 'none';
                remoteConsumptionInput.removeAttribute('required');
                remoteConsumptionInput.value = '';
            }
        });

        // Form Gö
